<!DOCTYPE html>
<html>
<head><title>Path Test</title></head>
<body>
<h1>Template Path Test</h1>
<script src="/js/data-loader.js"></script>
<script>
dataLoader.getTemplates().then(templates => {
    const list = templates.slice(0, 5).map(t => t.id + ' -> ' + t.path).join('\n');
    document.body.innerHTML += '<pre>' + list + '</pre>';
    console.log('Templates:', templates.slice(0, 5));
});
</script>
